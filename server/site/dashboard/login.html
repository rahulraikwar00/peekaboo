<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Log in · Peekaboo</title>
    <link rel="stylesheet" href="/site/styles.css" />
  </head>
  <body class="auth">
    <a href="#main" class="skip-link">Skip to main content</a>
    <main class="card" id="main">
      <h1>Peekaboo</h1>
      <p>Log in to your dashboard.</p>

      <a class="btn google" href="{{ base_url }}/auth/oauth/start?provider=google" role="button">Continue with Google</a>
      <a class="btn github" href="{{ base_url }}/auth/oauth/start?provider=github" role="button">Continue with GitHub</a>

      <div class="alt">or paste an API key</div>
      <form method="post" action="/auth/login" class="keyform">
        <label for="api-key" class="sr-only">API key</label>
        <input type="text" id="api-key" name="api_key" placeholder="pbk_..." autocomplete="off" required />
        <button type="submit">Log in with API key</button>
      </form>
    </main>
  </body>
</html>
