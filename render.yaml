services:
  - type: web
    name: peekaboo-server
    runtime: docker
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: STORAGE_BACKEND
        value: supabase
      - key: PUBLIC_BASE_URL
        sync: false
