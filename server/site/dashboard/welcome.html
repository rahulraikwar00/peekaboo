<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Save your API key · Peekaboo</title>
    <link rel="stylesheet" href="/site/styles.css" />
  </head>
  <body class="auth">
    <main class="card">
      <div class="check" aria-hidden="true">&#10003;</div>
      <h1>You're in.</h1>
      <p>Save this API key now — we'll only show it once. Use it to log in from another device.</p>
      <code class="key" aria-label="Your API key">{{ api_key }}</code>
      <a class="btn primary" href="/dashboard" role="button">Go to dashboard &rarr;</a>
    </main>
  </body>
</html>
