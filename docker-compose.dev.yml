services:
  peekaboo:
    build: .
    image: peekaboo:dev
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-supabase}
      DATABASE_URL: /data/peekaboo.db
      # Public base used for OAuth redirects and provider webhook URLs.
      # For local dev against real providers, set this to a reachable HTTPS
      # tunnel URL (e.g. ngrok/cloudflared).
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY}
      WIDGET_SIGNING_SECRET: ${WIDGET_SIGNING_SECRET:-}
    volumes:
      - ./server:/app/server
      - ./frontend/dist:/app/frontend/dist
      - peekaboo_data:/data
    command: uvicorn server.main:app --reload --host 0.0.0.0 --port 8000

volumes:
  peekaboo_data: