<button
  class="launcher"
  type="button"
  aria-expanded="false"
  aria-label="Open chat"
>
  +
</button>
<section class="panel" aria-label="Chat with the website owner">
  <header>
    <strong>Chat with us</strong>
    <span class="status">
      <span class="status-dot"></span>
      <span class="status-text">Connecting...</span>
    </span>
  </header>
  <div class="messages" aria-live="polite">
    <div class="message owner">Hi! How can we help?</div>
  </div>
  <div class="name-prompt" hidden>
    <label for="pboo-name">Your name (optional)</label>
    <div class="name-row">
      <input
        id="pboo-name"
        aria-label="Your name"
        placeholder="e.g. Rahul"
        maxlength="64"
      /><button type="button" class="name-skip">Skip</button>
    </div>
  </div>
  <form>
    <input
      aria-label="Message"
      placeholder="Write a message..."
      autocomplete="off"
    /><button type="submit">Send</button>
  </form>
</section>
